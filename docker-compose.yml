name: narada
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["dynamodb:/home/dynamodblocal/data"]
  queue:
    image: softwaremill/elasticmq-native:1.6.15
    ports: ["127.0.0.1:9324:9324", "127.0.0.1:9325:9325"]
  mail:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
    volumes: ["mail:/data"]
volumes:
  dynamodb:
  mail:
